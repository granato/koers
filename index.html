<!DOCTYPE html>
<html lang="nl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fun Koers op Rollen – live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
:root{--brandfont:'Oswald','Arial Narrow',system-ui,sans-serif}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f1420;color:#e9eef7;font-size:15px}
main{max-width:560px;margin:0 auto;padding:10px 12px 40px}
button{font:inherit;cursor:pointer}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.kb{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:700;background:#eef0f4;color:#3b4252;white-space:nowrap}.kb.F{background:#ffd54f;color:#4a3b00}.kb.BR{background:#c4511f;color:#fff}.kb.KF{background:#ffe9b0;color:#5a4700}.kb.FUN{background:#d6f5e3;color:#145a32}.kb.R2{background:#e3ecff;color:#1d3f8f}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* phone view */
body.gsm{background:#0f1420;color:#e9eef7}
body.gsm header{display:none}
body.gsm main{max-width:560px;padding:10px 12px 40px}
.g-top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.g-ev{font-size:20px;font-weight:800}.g-sub{font-size:12px;color:#8fa0bd}
.g-clk{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.g-card{background:#1a2133;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.g-card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:#9fb0cc}
.g-card.now{border:2px solid #e4572e}
.g-card.mecard{border:2px solid #ffd54f}
.g-big{font-size:18px;font-weight:800}
.g-heat{padding:8px 0;border-bottom:1px solid #2a3450}.g-heat:last-child{border:0}
.g-h1{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.g-h1 .tm{font-variant-numeric:tabular-nums;color:#ffd54f;font-weight:800;min-width:42px}
.g-names{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:4px;font-size:14px}
.g-names span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-names .bk{color:#8fa0bd;font-size:12px;margin-right:3px}
.mine{color:#ffd54f;font-weight:800}
.g-heat.me{background:rgba(255,213,79,.08);margin:0 -8px;padding:8px}
.g-tabs{display:flex;gap:6px;margin:4px 0 10px}
.g-tabs button,.g-chips button{flex:1;background:#232c42;color:#cfd8e8;border:0;border-radius:10px;padding:9px 6px;font-weight:700}
.g-tabs button.on{background:#e4572e;color:#fff}
.g-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.g-chips button{flex:0 0 auto;font-size:12.5px;padding:6px 10px}
.g-chips button.on{outline:2px solid #fff}
.g-in{width:100%;background:#0f1420;color:#fff;border:1px solid #3a4666;border-radius:10px;padding:11px 12px;font-size:16px}
.g-res button{display:block;width:100%;text-align:left;background:#232c42;color:#fff;border:0;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:15px}
.g-tbl{width:100%;font-size:14px}.g-tbl td,.g-tbl th{border-bottom:1px solid #2a3450;padding:6px 4px;color:#e9eef7}.g-tbl th{color:#8fa0bd}
.g-tbl tr.mine td{color:#ffd54f;font-weight:800}
.g-kv{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}
.g-link{background:none;border:0;color:#8fb4ff;padding:0;font-size:13px;font-weight:600}
.g-note{font-size:12.5px;color:#8fa0bd;line-height:1.45}
/* phone view: huisstijl */
.g-spons div{display:flex;flex-wrap:wrap;gap:8px}.g-spons span{background:#f4efe4;color:#14213a;border-radius:999px;padding:5px 12px;font-family:var(--brandfont);font-weight:600;font-size:15px}
body.gsm{background:#0e1828}
.g-card{background:#17243d}
.g-card.now{border-color:#c4511f}
.g-ev{display:flex;align-items:center;gap:8px;font-family:var(--brandfont);text-transform:uppercase;letter-spacing:.5px}
.g-ev .b-fun{color:#c4511f;font-weight:700}.g-ev .b-rest{color:#f4efe4;font-weight:600}
.g-logo{width:30px;height:30px;border-radius:50%;background:#fff;object-fit:contain;padding:2px}
.g-card h3,.g-big,.g-tabs button,.g-h1 b,.g-clk{font-family:var(--brandfont);letter-spacing:.3px}
.g-card h3{color:#d8cfbb}
.g-tabs button.on{background:#c4511f}
.g-heat,.g-tbl td,.g-tbl th{border-color:#26385a}

.g-live{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#4caf50;letter-spacing:.3px}
.g-live i{width:9px;height:9px;border-radius:50%;background:#4caf50;display:inline-block;animation:gpulse 1.8s ease-in-out infinite}
.g-live.off{color:#ff7a59}.g-live.off i{background:#ff7a59;animation:none}
.g-upd{color:#8fa0bd}
@keyframes gpulse{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,.6)}50%{box-shadow:0 0 0 6px rgba(76,175,80,0)}}
.offline{background:#5a2a1a;color:#ffd9c9;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
</style>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=id=>S.riders.find(r=>r.id===id);
const rname=id=>{const r=R(id);return r?r.name:'?'};
let S={settings:{name:'Fun Koers op Rollen',start:'19:00',slot:4.5,pts:[4,3,2,1]},riders:[],items:[]};
let SYNC='',ONLINE=true,LASTOK=0,LASTV=0;
const GSM={tab:'schema',cat:null,done:false};
function sponsorList(){const own=String((S.settings&&S.settings.sponsors)||'').split('\n').map(t=>t.trim()).filter(Boolean);if(own.length)return own;return String((S.settings&&S.settings.ticker)||'').split('\n').map(t=>t.trim()).filter(t=>/^(met\s+)?dank\s+aan\b|^sponsor/i.test(t))}
function sponsorName(l){return String(l).replace(/^(met\s+)?dank\s+aan\s*:?\s*/i,'').replace(/^sponsors?\s*:?\s*/i,'')||l}
function brandName(){const n=String((S&&S.settings&&S.settings.name)||'').trim();return(!n||/^rollerrace$/i.test(n))?'Fun Koers op Rollen':n}
function brandHtml(){const n=brandName();const m=n.match(/^(fun)\s+(.*)$/i);return m?`<span class="b-fun">${esc(m[1])}</span> <span class="b-rest">${esc(m[2])}</span>`:`<span class="b-rest">${esc(n)}</span>`}
function catName(k){return CATMAP[k]?CATMAP[k].name:(k===GUEST?'Gast':'Onbekend')}
function catColor(k){return CATMAP[k]?CATMAP[k].color:(k===GUEST?'#607d8b':'#9e9e9e')}
function catBadge(k){return k?`<span class="badge" style="background:${catColor(k)}">${esc(catName(k))}</span>`:''}
function cnt(it){return it.slots.filter(Boolean).length}
function fmtT(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function startTs(){if(S.startedAt)return S.startedAt;const [h,m]=(S.settings.start||'19:00').split(':').map(Number);const d=new Date(S.generatedAt||Date.now());d.setHours(h||0,m||0,0,0);return d.getTime()}
function itemTitle(it){
 if(it.t==='block')return esc(it.label);
 if(it.kind==='FUN')return 'Uitdaging U'+it.no;
 if(it.kind==='F')return 'Finale '+catName(it.cat);
 if(it.kind==='KF')return 'Kleine finale '+catName(it.cat);
 if(it.kind==='BR')return 'Barrage '+catName(it.cat);
 return 'Heat '+it.no;
}
function standings(cat){
 const pts=S.settings.pts;const rows={};
 S.riders.filter(r=>r.cat===cat).forEach(r=>rows[r.id]={id:r.id,name:r.name,present:r.present,pts:0,races:0,pos:{R1:'',R2:''},c:[0,0,0,0]});
 for(const it of S.items){if(it.cat!==cat||!(it.kind==='R1'||it.kind==='R2')||!it.done)continue;
  const sc=it.res.filter(id=>rows[id]);sc.forEach((id,i)=>{rows[id].pts+=pts[i]||0;if(i<4)rows[id].c[i]++;rows[id].pos[it.kind]=i+1});
  it.slots.forEach(id=>{if(rows[id]){rows[id].races++;if(!it.res.includes(id))rows[id].pos[it.kind]='DNF'}})}
 const list=Object.values(rows).filter(x=>x.present||x.races>0);
 // tie-break data: head-to-head (R1/R2 heats), place in round 2, barrage result
 const meets=S.items.filter(it=>it.cat===cat&&(it.kind==='R1'||it.kind==='R2')&&it.done);
 const pl=(it,id)=>{const k=it.res.indexOf(id);return k<0?99:k};
 const h2h=(a,b)=>{let sc=0;for(const it of meets){if(it.slots.includes(a.id)&&it.slots.includes(b.id)){const d=pl(it,a.id)-pl(it,b.id);if(d<0)sc++;else if(d>0)sc--}}return -sc};
 const r2=x=>typeof x.pos.R2==='number'?x.pos.R2:99;
 const brs=S.items.filter(it=>it.kind==='BR'&&it.cat===cat&&it.done&&it.res.length);
 const brc=(a,b)=>{for(let i=brs.length-1;i>=0;i--){const it=brs[i];if(it.slots.includes(a.id)&&it.slots.includes(b.id)){const d=pl(it,a.id)-pl(it,b.id);if(d)return d}}return 0};
 const cmp=(a,b)=>b.pts-a.pts||b.c[0]-a.c[0]||b.c[1]-a.c[1]||b.c[2]-a.c[2]||h2h(a,b)||(r2(a)-r2(b))||brc(a,b);
 list.sort((a,b)=>(b.present-a.present)||cmp(a,b)||a.name.localeCompare(b.name));
 const raced=qualDone(cat);const pres=list.filter(x=>x.present);const cuts=S.settings.kf?[4,8]:[4];
 list.forEach(x=>x.tie=false);
 list.tieGroups=[];
 if(raced){let s0=0;for(let i=1;i<=pres.length;i++){if(i===pres.length||cmp(pres[i-1],pres[i])){const e0=i-1;const cut=cuts.find(c=>s0<c&&e0>=c);if(e0>s0&&cut){for(let k=s0;k<=e0;k++)pres[k].tie=true;list.tieGroups.push({cut,ids:pres.slice(s0,e0+1).map(x=>x.id)})}s0=i}}}
 return list;
}
function qualDone(cat){const q=S.items.filter(i=>(i.kind==='R1'||i.kind==='R2')&&i.cat===cat);return q.length>0&&q.every(i=>i.done||i.skip)}
function finalRanking(cat){
 const st=standings(cat);const used=new Set();const out=[];
 const F=S.items.find(i=>i.kind==='F'&&i.cat===cat&&i.done);const KF=S.items.find(i=>i.kind==='KF'&&i.cat===cat&&i.done);
 const take=(it)=>{if(!it)return;it.res.forEach(id=>{if(!used.has(id)&&R(id)&&R(id).cat===cat){used.add(id);out.push(id)}});it.slots.forEach(id=>{if(id&&!used.has(id)&&R(id)&&R(id).cat===cat){used.add(id);out.push(id)}})};
 take(F);if(F)take(KF);
 st.forEach(x=>{if(!used.has(x.id)){used.add(x.id);out.push(x.id)}});
 return {final:!!F,order:out,st};
}
function dur(it){const sl=+S.settings.slot||4.5;if(it.skip)return 0;if(it.t==='heat')return sl;const ch=S.items.filter(i=>i.parent===it.id&&!i.skip).length;return Math.max(0,(+it.min||0)-ch*sl)}
function computeTimes(){
 const base=startTs();let cur=base,plan=base,first=true;const now=Date.now();const anyDone=S.items.some(i=>i.done&&i.doneAt);
 for(const it of S.items){const d=dur(it)*60000;it._plan=plan;plan+=d;
  if(it.done){it._start=it.doneAt?it.doneAt-(it.t==='heat'?d:0):cur;if(it.doneAt)cur=it.doneAt;else cur+=d}
  else if(it.skip){it._start=cur}
  else{let s=cur;if(first){first=false;if(anyDone)s=Math.max(cur,now)}it._start=s;cur=s+d}}
 return{planEnd:plan,expEnd:cur};
}
function current(){return S.items.find(i=>!i.done&&!i.skip)}
function upcomingHeats(n,afterId){const out=[];let pass=!afterId;for(const it of S.items){if(!pass){if(it.id===afterId)pass=true;continue}if(it.t==='heat'&&!it.done&&!it.skip)out.push(it);if(out.length>=n)break}return out}
function meId(){try{return localStorage.getItem('rr_me')||''}catch(e){return''}}
function gHeat(it,me,opts){opts=opts||{};const hasMe=it.slots.includes(me);
 const ids=it.done&&it.res.length?it.res.concat(it.slots.filter(x=>x&&!it.res.includes(x))):it.slots;
 const names=ids.map((id,i)=>{if(!id)return'';const p=it.done?(it.res.indexOf(id)>=0?(it.res.indexOf(id)+1)+'.':'–'):(i+1);return`<span class="${id===me?'mine':''}"><span class="bk">${it.done?p:'🚲'+p}</span>${esc(rname(id))}</span>`}).filter(Boolean).join('');
 return`<div class="g-heat ${hasMe?'me':''}"><div class="g-h1">${opts.time===false?'':`<span class="tm">${it.done?'✓':fmtT(it._start)}</span>`}<b>${itemTitle(it)}</b>${it.cat&&it.kind!=='F'&&it.kind!=='KF'?catBadge(it.cat):''}${it.kind!=='R1'&&it.kind!=='R2'?`<span class="kb ${it.kind}">${KIND[it.kind]}</span>`:''}</div>${cnt(it)?`<div class="g-names">${names}</div>`:`<div class="g-note">${it.kind==='F'?'Top 4 na ronde 2':it.kind==='KF'?'Plaatsen 5–8 na ronde 2':'Wordt nog ingevuld'}</div>`}</div>`}
function vGsm(){
 const me=meId();const meR=R(me);const upd=S.publishedAt||S.updated;
 let h=`<div class="g-top"><div><div class="g-ev"><img class="g-logo" src="${LOGO}" alt="">${brandHtml()}</div><div class="g-sub">${upd?'Info van '+fmtT(upd)+' · ververst vanzelf':'Live info'}</div></div><div class="g-clk" id="gclk"></div></div>`;
 if(!S.items.length)return h+`<div class="g-card"><div class="g-big">Welkom! 👋</div><p class="g-note">Het wedstrijdschema verschijnt hier zodra de organisatie het opmaakt. Kom straks terug.</p></div>`;
 computeTimes();const cur=current();
 // me
 if(!meR||meR.cat===GUEST){h+=`<div class="g-card mecard"><h3>Wanneer rijd ik?</h3><input class="g-in" placeholder="Typ je naam…" oninput="A.gq(this.value)" autocomplete="off"><div class="g-res" id="gres"></div></div>`}
 else{const mine=S.items.filter(i=>i.t==='heat'&&i.slots.includes(me));const nxt=mine.find(i=>!i.done&&!i.skip);
  const pend=S.items.filter(i=>i.t==='heat'&&!i.done&&!i.skip);const before=nxt?pend.indexOf(nxt):-1;
  const st=standings(meR.cat);const rk=st.findIndex(x=>x.id===me);const my=st[rk];
  h+=`<div class="g-card mecard"><div class="row" style="justify-content:space-between"><div class="g-big">${esc(meR.name)} ${catBadge(meR.cat)}</div><button class="g-link" onclick="A.setMe('')">wijzig</button></div>`;
  if(nxt){h+=`<div style="margin-top:10px;font-size:15px">${before===0?'<b style="color:#4caf50">🚴 Je bent NU aan de beurt!</b>':before===1?'<b style="color:#ffd54f">⏰ Maak je klaar, jij bent de volgende!</b>':`Jouw volgende rit: <b>nog ${before} heats</b>`}</div>
   <div class="g-kv"><span>${itemTitle(nxt)}</span><b>±${fmtT(nxt._start)} · fiets ${nxt.slots.indexOf(me)+1}</b></div>`}
  else h+=`<div class="g-note" style="margin-top:8px">${qualDone(meR.cat)?'Je ritten zitten erop. Bedankt om mee te doen! 🎉':'Geen rit meer gepland.'}</div>`;
  const done=mine.filter(i=>i.done);if(done.length)h+=done.map(i=>{const p=i.res.indexOf(me);return`<div class="g-kv"><span>${itemTitle(i)}</span><b>${p>=0?(p+1)+'e':'–'}${(i.kind==='R1'||i.kind==='R2')&&p>=0?' · '+(S.settings.pts[p]||0)+' ptn':''}</b></div>`}).join('');
  if(my&&my.races)h+=`<div class="g-kv"><span>Stand ${esc(catName(meR.cat))}</span><b>${rk+1}e · ${my.pts} ptn</b></div>`;
  h+=`</div>`}
 // now + next
 if(cur&&cur.t==='block')h+=`<div class="g-card now"><h3>Nu</h3><div class="g-big">${cur.role==='end'?'🏆':'🎉'} ${esc(cur.label)}</div>${cur.role==='fun'?'<div class="g-note">Daag iemand uit aan de wedstrijdtafel!</div>':''}</div>`;
 else if(cur)h+=`<div class="g-card now"><h3>Nu op de rollers</h3>${gHeat(cur,me,{time:false})}</div>`;
 else h+=`<div class="g-card now"><div class="g-big">🏁 Alles is gereden!</div><div class="g-note">Bekijk de eindstand bij Klassement.</div></div>`;
 const up=upcomingHeats(4,cur?cur.id:null).filter(i=>!cur||i.id!==cur.id).slice(0,3);
 if(up.length)h+=`<div class="g-card"><h3>Straks</h3>${up.map(i=>gHeat(i,me)).join('')}</div>`;
 // tabs
 h+=`<div class="g-tabs">${[['schema','Schema'],['uitslagen','Uitslagen'],['klassement','Klassement']].map(([k,l])=>`<button class="${GSM.tab===k?'on':''}" onclick="A.gtab('${k}')">${l}</button>`).join('')}</div>`;
 if(GSM.tab==='schema'){const its=S.items.filter(i=>!i.skip&&(GSM.done||!i.done));const nd=S.items.filter(i=>i.done&&i.t==='heat').length;
  h+=`<div class="g-card">${nd?`<button class="g-link" onclick="A.gdone()">${GSM.done?'Verberg gereden heats':'Toon ook de '+nd+' gereden heats'}</button>`:''}${its.map(i=>i.t==='block'?`<div class="g-heat"><div class="g-h1"><span class="tm">${fmtT(i._start)}</span><b>${i.role==='end'?'🏆':'🎉'} ${esc(i.label)}</b></div></div>`:gHeat(i,me)).join('')}</div>`}
 if(GSM.tab==='uitslagen'){const d=S.items.filter(i=>i.t==='heat'&&i.done).reverse();h+=`<div class="g-card">${d.length?d.map(i=>gHeat(i,me)).join(''):'<div class="g-note">Nog geen uitslagen.</div>'}</div>`}
 if(GSM.tab==='klassement'){const cats=CATS.filter(c=>S.riders.some(r=>r.cat===c.key));const sel=GSM.cat||(meR&&CATMAP[meR.cat]?meR.cat:(cats[0]||{}).key);
  h+=`<div class="g-chips">${cats.map(c=>`<button class="${sel===c.key?'on':''}" style="background:${c.color};color:#fff" onclick="A.gcat('${c.key}')">${c.name}</button>`).join('')}</div>`;
  if(sel){const fr=finalRanking(sel);const stm=Object.fromEntries(fr.st.map(x=>[x.id,x]));const pres=fr.st.filter(x=>x.present);const fI=new Set(pres.slice(0,4).map(x=>x.id)),kI=new Set(pres.slice(4,8).map(x=>x.id));
   h+=`<div class="g-card"><div class="g-note" style="margin-bottom:6px">${fr.final?'🏆 Eindstand':qualDone(sel)?'Ronde 1 en 2 gereden – op naar de finales':'Tussenstand na de reeksen'}</div><table class="g-tbl"><tr><th>#</th><th>Naam</th><th>R1</th><th>R2</th><th>Ptn</th></tr>${fr.order.map((id,i)=>{const x=stm[id]||{name:rname(id),pos:{},pts:0};return`<tr class="${id===me?'mine':''}"><td>${fr.final&&i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${esc(x.name)}${!fr.final&&fI.has(id)?' <span class="kb F">F</span>':!fr.final&&kI.has(id)?' <span class="kb KF">KF</span>':''}</td><td>${x.pos.R1??''}</td><td>${x.pos.R2??''}</td><td><b>${x.pts}</b></td></tr>`}).join('')}</table></div>`}}
 const spl=sponsorList();if(spl.length)h+=`<div class="g-card g-spons"><h3>🤝 Met dank aan onze sponsors</h3><div>${spl.map(x=>`<span>${esc(sponsorName(x))}</span>`).join('')}</div></div>`;
 if(SYNC==='readonly')h+=`<div class="g-card g-note">👁 Je bekijkt de publieke pagina. Uitslagen invoeren kan enkel met bewerkrechten op de app.</div>`;
 h+=`<div class="g-card g-note">Iedereen rijdt 2 reeksen binnen de eigen categorie. Punten per reeks: ${S.settings.pts.map((p,i)=>`${i+1}e = ${p}`).join(', ')}. De top 4 rijdt de finale, plaatsen 5–8 de kleine finale. Gelijke punten? Dan tellen het aantal overwinningen, het onderling duel en je plaats in ronde 2; staat het dan nog gelijk, dan volgt een barrage. Tijden zijn een schatting: luister naar de oproepen. 🚲</div>`;
 return h;
}
function fmtS(ts){const d=new Date(ts);return fmtT(ts)+':'+String(d.getSeconds()).padStart(2,'0')}
function render(){let h;try{h=vGsm()}catch(e){console.error(e);document.getElementById('main').innerHTML='<div class="g-card"><div class="g-big">'+esc(brandName())+'</div><p class="g-note">Even geduld, de info wordt opnieuw geladen… ('+esc(e&&e.message)+')</p></div>';return}const upd=S.publishedAt||S.updated;
 const live=ONLINE?'<span class="g-live"><i></i>Live</span>':'<span class="g-live off"><i></i>Geen verbinding</span>';
 h=h.replace(/<div class="g-sub">[^<]*<\/div>/,'<div class="g-sub">'+live+(upd?' <span class="g-upd">· info van '+fmtT(upd)+'</span>':'')+'</div>');if(!ONLINE)h='<div class="offline">⚠ Geen verbinding. Je ziet de laatst gekende info'+(S.publishedAt?' van '+fmtT(S.publishedAt):'')+'.</div>'+h;
 const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('g-in')&&ae.value)return;document.getElementById('main').innerHTML=h;tick()}
function tick(){const gc=document.getElementById('gclk');if(gc)gc.textContent=fmtT(Date.now())}
function adopt(d){if(!d||d.empty||!Array.isArray(d.riders)||!Array.isArray(d.items))return false;
 d.settings=Object.assign({name:'Fun Koers op Rollen',start:'19:00',slot:4.5,pts:[4,3,2,1]},d.settings||{});S=d;return true}
async function load(){try{const ac=window.AbortController?new AbortController():null;const to=setTimeout(()=>{if(ac)ac.abort()},8000);const r=await fetch(RELAY+'?t='+Date.now(),{cache:'no-store',signal:ac?ac.signal:undefined}).finally(()=>clearTimeout(to));if(!r.ok)throw new Error(r.status);const d=await r.json();ONLINE=true;
  if(d.empty){S.riders=[];S.items=[];render();return}
  const v=d.publishedAt||d.relayedAt||0;LASTOK=Date.now();if(v!==LASTV&&adopt(d)){LASTV=v;try{localStorage.setItem(CACHE,JSON.stringify(d))}catch(e){}}render()}
 catch(e){ONLINE=false;render()}}
const A={
 gq(q){q=q.trim().toLowerCase();const el=document.getElementById('gres');if(!el)return;if(q.length<2){el.innerHTML='';return}
  const m=S.riders.filter(r=>r.cat!==GUEST&&r.name.toLowerCase().includes(q)).slice(0,6);el.innerHTML=m.length?m.map(r=>`<button onclick="A.setMe('${r.id}')">${esc(r.name)} <span class="badge" style="background:${catColor(r.cat)}">${esc(catName(r.cat))}</span></button>`).join(''):'<div class="g-note" style="margin-top:6px">Niet gevonden. Vraag het aan de wedstrijdtafel.</div>'},
 setMe(id){try{if(id)localStorage.setItem('rr_me',id);else localStorage.removeItem('rr_me')}catch(e){}window.scrollTo(0,0);render()},
 gtab(t){GSM.tab=t;render()},gcat(c){GSM.cat=c;render()},gdone(){GSM.done=!GSM.done;render()},
};
try{adopt(JSON.parse(localStorage.getItem(CACHE)||'null'))}catch(e){}
if(S.items.length){try{render()}catch(e){}}
/* Zuinig ophalen: interval komt uit de planner (standaard 10 s), enkel zolang iemand naar de pagina kijkt. Bij openen meteen. */
const every=()=>1000*Math.min(60,Math.max(2,+(S.settings&&S.settings.pollSec)||10));let timer=null,lastLoad=0;
function poll(){clearTimeout(timer);if(document.hidden)return;lastLoad=Date.now();load().finally(()=>{timer=setTimeout(poll,every())})}
poll();
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer)}else if(Date.now()-lastLoad>5000){poll()}else{clearTimeout(timer);timer=setTimeout(poll,every())}});
window.addEventListener('focus',()=>{if(!document.hidden&&Date.now()-lastLoad>15000)poll()});
setInterval(()=>{const ae=document.activeElement;if(!document.hidden&&!(ae&&ae.tagName==='INPUT'))render()},30000);
setInterval(tick,5000);
</script>
</body>
